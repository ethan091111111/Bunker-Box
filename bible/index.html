<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Bible — Bunker Box</title>
<meta name="description" content="Read the Holy Bible (King James Version) on Bunker Box.">
<meta name="theme-color" content="#b7ff39">
<link rel="icon" href="/images/ball.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Lora:ital,wght@0,400;0,600;1,400&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/arcade.css">
<style>
  .reader { max-width: 760px; margin: 0 auto; padding: 48px 5% 80px; }
  .reader .eyebrow { color: var(--lime); margin-bottom: 14px; }
  .reader h1 { font-size: clamp(56px, 10vw, 96px); margin: 0 0 6px; }
  .reader h1 em { color: var(--lime); font-style: normal; }
  .version { font: 11px 'Space Mono', monospace; color: var(--muted); letter-spacing: 1px; margin: 0 0 32px; }
  .picker { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 36px; }
  .picker select, .picker button {
    font: 700 13px 'Space Grotesk', Arial, sans-serif; letter-spacing: .5px;
    background: #1c201a; color: var(--paper); border: 1px solid #4b503e; padding: 12px 14px; border-radius: 0;
  }
  .picker select { flex: 1 1 180px; min-width: 0; }
  .picker select#chapter { flex: 0 0 140px; }
  .picker button { cursor: pointer; }
  .picker button:hover:not(:disabled) { border-color: var(--lime); color: var(--lime); }
  .picker button:disabled { opacity: .35; cursor: default; }
  #heading { font-family: 'Anton', Impact, sans-serif; font-size: clamp(34px, 6vw, 52px); font-weight: 400; margin: 0 0 22px; color: var(--paper); }
  #text { font: 19px/1.8 'Lora', Georgia, serif; color: #e6e5dc; }
  #text p { margin: 0 0 6px; }
  #text sup { font: 700 11px 'Space Mono', monospace; color: var(--lime); margin-right: 6px; vertical-align: 3px; }
  #text .jump { background: #b7ff3922; outline: 1px solid #b7ff3966; }
  .status { font: 13px 'Space Mono', monospace; color: var(--muted); }
  .bottom-nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 40px; }
  .bottom-nav button { font: 700 13px 'Space Grotesk', Arial, sans-serif; background: var(--lime); color: var(--ink); border: 2px solid var(--ink); padding: 14px 18px; cursor: pointer; box-shadow: 4px 4px 0 #75874b; }
  .bottom-nav button:disabled { visibility: hidden; }
  .back { color: var(--lime); font: 700 12px 'Space Grotesk', Arial, sans-serif; letter-spacing: 1px; text-decoration: none; }
  @media (max-width: 600px) { #text { font-size: 17px; } .picker .arrow { flex: 1; } }
</style>
</head>
<body>
<header><a href="/" class="logo" aria-label="Bunker Box Arcade home"><span class="logo-icon">B✦</span>BUNKER<span>BOX</span><i>ARCADE</i></a><nav aria-label="Main"><a class="back" href="/">← BACK TO THE GAMES</a></nav></header>
<main class="reader">
  <p class="eyebrow">✝ THE HOLY BIBLE</p>
  <h1>THE <em>BIBLE.</em></h1>
  <p class="version">KING JAMES VERSION</p>

  <div class="picker">
    <select id="book" aria-label="Book"></select>
    <select id="chapter" aria-label="Chapter"></select>
    <button id="prev" class="arrow" aria-label="Previous chapter">← PREV</button>
    <button id="next" class="arrow" aria-label="Next chapter">NEXT →</button>
  </div>

  <h2 id="heading"></h2>
  <div id="text" aria-live="polite"><p class="status">Loading…</p></div>

  <div class="bottom-nav">
    <button id="prev2">← PREVIOUS CHAPTER</button>
    <button id="next2">NEXT CHAPTER →</button>
  </div>
</main>
<footer><a class="logo" href="/">BUNKER<span>BOX</span> ✦</a><p>The Holy Bible, King James Version.</p><small>Public domain text.</small></footer>

<script>
const BOOKS = ["Genesis","Exodus","Leviticus","Numbers","Deuteronomy","Joshua","Judges","Ruth","1 Samuel","2 Samuel","1 Kings","2 Kings","1 Chronicles","2 Chronicles","Ezra","Nehemiah","Esther","Job","Psalms","Proverbs","Ecclesiastes","Song of Solomon","Isaiah","Jeremiah","Lamentations","Ezekiel","Daniel","Hosea","Joel","Amos","Obadiah","Jonah","Micah","Nahum","Habakkuk","Zephaniah","Haggai","Zechariah","Malachi","Matthew","Mark","Luke","John","Acts","Romans","1 Corinthians","2 Corinthians","Galatians","Ephesians","Philippians","Colossians","1 Thessalonians","2 Thessalonians","1 Timothy","2 Timothy","Titus","Philemon","Hebrews","James","1 Peter","2 Peter","1 John","2 John","3 John","Jude","Revelation"];
const CHAPTERS = [50,40,27,36,34,24,21,4,31,24,22,25,29,36,10,13,10,42,150,31,12,8,66,52,5,48,12,14,3,9,1,4,7,3,3,3,2,14,4,28,16,24,21,28,16,16,13,6,6,4,4,5,3,6,4,3,1,13,5,5,3,5,1,1,1,22];
const $ = s => document.querySelector(s);
const cache = {};
let book = 43, chapter = 1, verse = 0;

const bookSel = $("#book"), chapSel = $("#chapter");
bookSel.innerHTML = `<optgroup label="Old Testament">${BOOKS.slice(0,39).map((b,i)=>`<option value="${i+1}">${b}</option>`).join("")}</optgroup><optgroup label="New Testament">${BOOKS.slice(39).map((b,i)=>`<option value="${i+40}">${b}</option>`).join("")}</optgroup>`;

function slug(b) { return BOOKS[b-1].toLowerCase().replace(/ /g, "-"); }
function fromHash() {
  const m = decodeURIComponent(location.hash.slice(1)).toLowerCase().match(/^([a-z0-9-]+?)-(\d+)(?::(\d+))?$/);
  if (!m) return false;
  const b = BOOKS.findIndex((_, i) => slug(i+1) === m[1]) + 1;
  if (!b) return false;
  book = b; chapter = Math.min(Math.max(1, +m[2]), CHAPTERS[b-1]); verse = +(m[3] || 0);
  return true;
}
function remember() { try { localStorage.setItem("bunker:bible", JSON.stringify([book, chapter])); } catch {} }
function recall() { try { const v = JSON.parse(localStorage.getItem("bunker:bible")); if (Array.isArray(v) && CHAPTERS[v[0]-1] >= v[1]) [book, chapter] = v; } catch {} }

async function loadBook(b) {
  if (!cache[b]) cache[b] = fetch(`/bible/data/${b}.json`).then(r => { if (!r.ok) throw new Error(); return r.json(); });
  return cache[b];
}

function step(dir) {
  chapter += dir;
  if (chapter < 1) { book--; chapter = CHAPTERS[book-1]; }
  if (chapter > CHAPTERS[book-1]) { book++; chapter = 1; }
  verse = 0; show(true);
}

async function show(scroll) {
  bookSel.value = book;
  chapSel.innerHTML = Array.from({length: CHAPTERS[book-1]}, (_, i) => `<option value="${i+1}">Chapter ${i+1}</option>`).join("");
  chapSel.value = chapter;
  const first = book === 1 && chapter === 1, last = book === 66 && chapter === 22;
  $("#prev").disabled = $("#prev2").disabled = first;
  $("#next").disabled = $("#next2").disabled = last;
  $("#heading").textContent = `${BOOKS[book-1]} ${chapter}`;
  document.title = `${BOOKS[book-1]} ${chapter} — Bunker Box Bible`;
  history.replaceState(null, "", `#${slug(book)}-${chapter}${verse ? ":" + verse : ""}`);
  remember();
  const want = [book, chapter];
  try {
    const data = await loadBook(book);
    if (want[0] !== book || want[1] !== chapter) return;
    const text = $("#text");
    text.innerHTML = "";
    data[chapter-1].forEach((v, i) => {
      const p = document.createElement("p");
      p.id = "v" + (i+1);
      if (verse === i+1) p.className = "jump";
      const n = document.createElement("sup");
      n.textContent = i+1;
      p.append(n, v);
      text.append(p);
    });
    if (verse) document.getElementById("v" + verse)?.scrollIntoView({ block: "center" });
    else if (scroll) $("#heading").scrollIntoView({ block: "start" });
  } catch {
    $("#text").innerHTML = '<p class="status">Couldn\'t load this chapter. Check your connection and try again.</p>';
  }
}

bookSel.addEventListener("change", () => { book = +bookSel.value; chapter = 1; verse = 0; show(); });
chapSel.addEventListener("change", () => { chapter = +chapSel.value; verse = 0; show(); });
["#prev", "#prev2"].forEach(s => $(s).addEventListener("click", () => step(-1)));
["#next", "#next2"].forEach(s => $(s).addEventListener("click", () => step(1)));
document.addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT") return;
  if (e.key === "ArrowLeft" && !$("#prev").disabled) step(-1);
  if (e.key === "ArrowRight" && !$("#next").disabled) step(1);
});
window.addEventListener("hashchange", () => { if (fromHash()) show(); });

if (!fromHash()) recall();
show();
</script>
</body>
</html>
